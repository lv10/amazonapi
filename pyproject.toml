[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AmazonAPIWrapper"
version = "1.0.1"
description = "A modern, asynchronous and synchronous Python client for the Amazon Creators API and Product Advertising API (PA-API 5.0)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "lv10", email = "luis@lv10.me" },
]
keywords = [
    "amazon",
    "api",
    "wrapper",
    "creators-api",
    "paapi5",
    "product-advertising-api",
    "asyncio",
    "rest",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
]


[project.urls]
Homepage = "https://github.com/lv10/amazonapi"
Documentation = "https://github.com/lv10/amazonapi#readme"
Repository = "https://github.com/lv10/amazonapi"
Issues = "https://github.com/lv10/amazonapi/issues"

[tool.hatch.build.targets.wheel]
packages = ["amazon"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=amazon --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "python-semantic-release>=9.15.2",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["amazon/_version.py:__version__"]
tag_format = "{version}"
build_command = "uv build"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
